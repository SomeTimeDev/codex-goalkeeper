[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "goalkeeper"
version = "0.2.0"
description = "Evidence-first runtime supervision for long-running Codex goals."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Goalkeeper contributors" }]
keywords = ["codex", "goals", "evidence", "scope", "supervision", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development",
]
dependencies = []

[project.optional-dependencies]
codex = ["openai-codex>=0.1.0b3"]
proof = ["scopeproof @ git+https://github.com/SomeTimeDev/scopeproof.git"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
goalkeeper = "goalkeeper.cli:main"

[tool.setuptools.packages.find]
include = ["goalkeeper*"]

[tool.setuptools.package-data]
goalkeeper = ["assets/skills/goalkeeper/SKILL.md"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
